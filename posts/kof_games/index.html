<h3 id="📥-资源说明"><a href="#📥-资源说明" class="headerlink" title="📥 资源说明"></a>📥 资源说明</h3><ul>
<li><p><strong>作品列表</strong>：</p>
<ul>
<li>1994    拳皇 ‘94、1995    拳皇 ‘95</li>
<li>1996    拳皇 ‘96、1996    拳皇 ‘95 (GB)</li>
<li>1997    拳皇 ‘97、1997    拳皇 ‘96 (GB)</li>
<li>1998    拳皇 ‘98、1998    拳皇 R-1 (NGPC)</li>
<li>1999    拳皇 ‘99、1999    拳皇 R-2 (NGPC)</li>
<li>1999    拳皇 ‘98 (DC)</li>
<li>1999    SNK VS CAPCOM (NGPC)</li>
<li>2000    拳皇 2000、2000    拳皇 ‘99 Evolution (DC)</li>
<li>2000    少女格斗 (NGPC)</li>
<li>2000    CAPCOM VS SNK、2001    CAPCOM VS SNK 2</li>
<li>2001    拳皇 2001、2002    拳皇 2002</li>
<li>2002    拳皇 EX 1 (GBA)、2003    拳皇 EX 2 (GBA)</li>
<li>2003    拳皇 2003、2003    SNK VS CAPCOM Chaos</li>
<li>2004    拳皇 ‘94 Re-Bout </li>
<li>2004    拳皇 Neowave、2004    拳皇 MI (3D)</li>
<li>2005    拳皇 XI、2006    拳皇 MI 2 (3D)</li>
<li>2007    拳皇 MIA (3D)</li>
<li>2008    拳皇 ‘98 Ultimate Match (UM)</li>
<li>2009    拳皇 2002 Unlimited Match (UM)、2009    拳皇 XII</li>
<li>2010    拳皇 XIII、2016    拳皇 XIV</li>
<li>2017    拳皇 XIV DLC 1、2018    拳皇 XIV DLC 2</li>
<li>2020    少女格斗</li>
<li>2022    拳皇 XV、2022    拳皇 XV DLC 1</li>
<li>2023    拳皇 XV DLC 2、2024    拳皇 XV DLC 3</li>
</ul>
</li>
<li><p><strong>版本差异</strong>：</p>
<ul>
<li><strong>PS2 &#x2F; DC 移植版</strong>：<ul>
<li><strong>‘94 Re-Bout</strong>：重制 3D 背景，素材高清化，新增可选角色『草薙柴舟』及挑战模式。</li>
<li><strong>拳皇 ‘98 (DC)</strong>：副标题 Dream Match 1999，开场动画及背景 3D 全面重制。</li>
<li><strong>拳皇 ‘99 Evolution (DC)</strong>：相比街机版，新增了大量的 Extra Strikers（援护角色）。</li>
<li><strong>拳皇 2000 &#x2F; 2001 (PS2)</strong>：2000 版新增超过 10 名 Maniac Strikers（如娜可露露、菲欧等）；2001 版可开启 3D 背景，并增加伊格尼斯、零（原创）为可选角色。</li>
<li><strong>拳皇 2002 &#x2F; 2003 (PS2)</strong>：2002 版增加隐藏角色：矢吹真吾、King 以及暴走庵、高尼茨、吉斯等；2003 版增加 3D 背景及隐藏人物 ‘94 Joe。</li>
<li><strong>拳皇 XI &#x2F; NW</strong>：相比街机大幅补全，新增了双叶萤、B.珍妮特等《饿狼》系隐藏角色。</li>
<li><strong>拳皇 MIA</strong>：全称 Regulation “A”，MI 2 的加强版，增加了主角『阿修』等角色。</li>
</ul>
</li>
<li><strong>UM (Ultimate Match) 版</strong>：<ul>
<li><strong>‘98 UM</strong>：阵容扩充至 64 人，加入大蛇队及高尼茨等 Boss；新增 Ultimate 战斗模式。</li>
<li><strong>2002 UM</strong>：收录音巢篇全员；新增震撼的 Max2 超必杀特效；背景实现完全 3D 化。</li>
</ul>
</li>
<li><strong>GBA &#x2F; NGPC 版</strong>：<ul>
<li><strong>EX 系列</strong>：针对掌机原创了剧情与辅助系统 (Striker)；Gals’ Fighters 则主打女性角色联动。</li>
</ul>
</li>
</ul>
</li>
<li><p><strong>支持平台</strong>：电脑、掌机、手机模拟器全套</p>
</li>
<li><p><strong>包含版本</strong>：原版、UM 版、家用机增强版</p>
</li>
</ul>
